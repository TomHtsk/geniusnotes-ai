<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>NoteCaptain — Coming soon</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
<!-- Shown by middleware.js to visitors without access while SITE_LOCKED=true.
     Uses only absolute paths: it is served at whatever address the visitor asked for. -->
<style>
  :root { color-scheme: dark; --bg:#0B0F14; --surface:#131A21; --border:rgba(255,255,255,0.12); --text:#E8EDF2; --muted:#93A1AE;
    --accent:#5CC4D0; --error:#FF8A7A; --serif:'Source Serif 4', Georgia, serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 64px 16px; min-height: 100%; height: auto; position: relative; overflow-x: hidden; }
  body::before { content: ''; position: fixed; left: 50%; top: 50%; width: min(900px, 140vw); height: min(520px, 90vw);
    transform: translate(-50%, -50%); pointer-events: none; filter: blur(22px);
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.07) 30%, rgba(92,196,208,0.05) 46%, rgba(255,255,255,0) 64%); }
  .cs { position: relative; width: 100%; max-width: 460px; text-align: center; }
  .cs-logo { width: 76px; height: 76px; object-fit: contain; margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
  .cs-line { color: var(--muted); font-size: 1.02rem; line-height: 1.55; margin-bottom: 30px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; font-size: 0.95rem; outline: none; }
  input:focus { border-color: var(--accent); }
  button { height: 46px; padding: 0 18px; border-radius: 10px; border: 0; background: #fff; color: #0B0F14;
    font: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.6; cursor: default; }
  .cs-msg { min-height: 1.4em; margin-top: 10px; font-size: 0.88rem; color: var(--muted); }
  .cs-msg.ok { color: var(--accent); }
  .cs-msg.err { color: var(--error); }
  .cs-code-link { margin-top: 34px; background: none; border: 0; height: auto; padding: 4px; color: var(--muted);
    font-size: 0.82rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .cs-code-link:hover { color: var(--text); opacity: 1; }
  #code-form { margin-top: 12px; }
  #code-form[hidden], #code-link[hidden] { display: none; }
  .cs-foot { position: absolute; left: 0; right: 0; bottom: 20px; margin: 0; text-align: center; font-size: 0.78rem; color: var(--muted); }
  .cs-foot a { color: var(--muted); }
  @media (max-width: 420px) { form { flex-direction: column; } form input { flex: none; width: 100%; } form button { width: 100%; } }
</style>
</head>
<body>
<main class="cs">
  <img class="cs-logo" src="/images/logo-mark-white.png" alt="NoteCaptain logo" />
  <h1>NoteCaptain</h1>
  <p class="cs-line">NoteCaptain: AI study notes, flashcards and quizzes. Coming soon.</p>

  <form id="wl-form" novalidate>
    <input id="wl-email" type="email" autocomplete="email" placeholder="Your email" aria-label="Your email" maxlength="254" required />
    <button id="wl-btn" type="submit">Join the waitlist</button>
  </form>
  <p class="cs-msg" id="wl-msg" role="status"></p>

  <button class="cs-code-link" id="code-link" type="button">Have an access code?</button>
  <form id="code-form" hidden>
    <input id="code-input" type="password" autocomplete="current-password" placeholder="Access code" aria-label="Access code" maxlength="200" />
    <button id="code-btn" type="submit">Enter</button>
  </form>
  <p class="cs-msg" id="code-msg" role="status"></p>

  </main>
<p class="cs-foot"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="mailto:support@notecaptain.ai">support@notecaptain.ai</a></p>
<script>
(function () {
  function post(body) {
    return fetch('/api/subscription', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = {}; try { d = JSON.parse(t); } catch (e) {}
        return { ok: r.ok, data: d };
      });
    });
  }
  function say(el, text, kind) { el.textContent = text; el.className = 'cs-msg' + (kind ? ' ' + kind : ''); }
  var NET = 'Could not reach NoteCaptain. Check your connection and try again.';

  var wlForm = document.getElementById('wl-form'), wlEmail = document.getElementById('wl-email'),
      wlBtn = document.getElementById('wl-btn'), wlMsg = document.getElementById('wl-msg');
  wlForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = wlEmail.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say(wlMsg, 'Please enter a valid email address.', 'err'); return; }
    wlBtn.disabled = true; say(wlMsg, 'Adding you…');
    post({ action: 'waitlist', email: email }).then(function (r) {
      if (r.ok) { wlEmail.value = ''; say(wlMsg, "Thanks! You're on the list. We'll email you at launch.", 'ok'); }
      else say(wlMsg, r.data.error || 'Something went wrong. Please try again.', 'err');
    }, function () { say(wlMsg, NET, 'err'); }).then(function () { wlBtn.disabled = false; });
  });

  var codeLink = document.getElementById('code-link'), codeForm = document.getElementById('code-form'),
      codeInput = document.getElementById('code-input'), codeBtn = document.getElementById('code-btn'),
      codeMsg = document.getElementById('code-msg');
  codeLink.addEventListener('click', function () { codeLink.hidden = true; codeForm.hidden = false; codeInput.focus(); });
  codeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = codeInput.value;
    if (!code) { codeInput.focus(); return; }
    codeBtn.disabled = true; say(codeMsg, 'Checking…');
    post({ action: 'site-unlock', code: code }).then(function (r) {
      if (r.ok) {
        say(codeMsg, 'Welcome in!', 'ok');
        // Back to the page they asked for (this page is shown at that same address).
        if (location.pathname === '/coming-soon.html') location.replace('/');
        else location.reload();
        return;
      }
      codeInput.value = '';
      say(codeMsg, r.data.error || 'Incorrect code', 'err');
      codeBtn.disabled = false;
    }, function () { say(codeMsg, NET, 'err'); codeBtn.disabled = false; });
  });
})();
</script>
</body>
</html>
