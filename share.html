<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, follow" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Shared Note — NoteCaptain AI</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
    nav{display:flex;align-items:center;gap:12px;padding:0 24px;height:54px;background:var(--surface);border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
    .nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:0.92rem;font-weight:700;}
    .nav-logo img{width:26px;height:26px;border-radius:50%;object-fit:cover;}
    .ai{color:var(--accent2);}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
    .nav-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.3);}
    .collab-badge{background:rgba(var(--accent-rgb),0.15);color:var(--accent2);border-color:rgba(var(--accent-rgb),0.35);}
    .open-btn{background:var(--primary-bg);border:none;border-radius:8px;color:var(--primary-text);font-size:0.78rem;font-weight:700;padding:7px 14px;cursor:pointer;font-family:inherit;text-decoration:none;}
    main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:32px 24px 80px;}
    .note-meta{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.07);}
    .note-title{font-size:1.5rem;font-weight:800;color:var(--text);margin-bottom:6px;}
    .note-info{font-size:0.75rem;color:#555;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    #presence{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--accent2);}
    .presence-dot{width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block;flex-shrink:0;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
    #sync-status{font-size:0.7rem;color:#555;margin-left:auto;}
    #sync-status.saving{color:var(--accent2);}
    #sync-status.saved{color:#34d399;}
    /* Editor */
    #note-editor{font-size:0.9rem;line-height:1.85;color:var(--text);outline:none;min-height:300px;padding:4px 0;position:relative;}
    /* Remote cursors */
    .rc{position:absolute;pointer-events:none;z-index:100;}
    .rc-caret{display:inline-block;width:2px;height:1.2em;border-radius:1px;position:relative;animation:rc-blink 1.2s infinite;}
    @keyframes rc-blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
    .rc-label{position:absolute;top:-20px;left:0;font-size:10px;font-family:'Courier New',monospace;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;color:#fff;}
    #note-editor[contenteditable=true]{border:none;caret-color:var(--accent2);}
    #note-editor[contenteditable=true]:focus{outline:none;}
    #note-editor h1,#note-editor h2,#note-editor h3{color:var(--text);margin:18px 0 8px;}
    #note-editor p{margin-bottom:8px;}
    #note-editor ul,#note-editor ol{padding-left:24px;margin-bottom:10px;}
    #note-editor li{margin-bottom:3px;}
    #note-editor blockquote{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted);margin:10px 0;}
    #note-editor img{max-width:100%;border-radius:8px;}
    #note-editor mark{background:rgba(253,224,71,0.2);color:#fde047;border-radius:3px;padding:1px 3px;}
    #note-editor table{width:100%;border-collapse:collapse;margin:10px 0;}
    #note-editor td,#note-editor th{border:1px solid rgba(255,255,255,0.1);padding:7px 12px;}
    .toolbar{display:none;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:16px;flex-wrap:wrap;}
    .toolbar.visible{display:flex;}
    .tb{background:none;border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:var(--muted);font-size:0.75rem;padding:3px 8px;cursor:pointer;font-family:inherit;transition:all 0.12s;}
    .tb:hover{border-color:var(--accent2);color:var(--accent2);}
    .tb-sep{width:1px;height:16px;background:rgba(255,255,255,0.07);flex-shrink:0;}
    .state{text-align:center;padding:80px 24px;color:#666;}
    .spinner{width:28px;height:28px;border:3px solid rgba(var(--accent-rgb),0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    :root.light body{background:var(--bg);color:var(--text);}
    :root.light nav{background:var(--surface);}
    :root.light .note-title,:root.light #note-editor{color:var(--text);}
    :root.light #note-editor h1,:root.light #note-editor h2,:root.light #note-editor h3{color:var(--text);}
    :root.light .tb{border-color:rgba(0,0,0,0.12);color:#666;}
    /* Logo: white mark on dark theme, dark mark on light theme */
    .logo-lt{display:none!important;}
    :root.light .logo-lt{display:block!important;}
    :root.light .logo-dk{display:none!important;}
  </style>
  <script src="js/theme-init.js"></script>
  <style id="logbook-look">
    /* ═══ LOGBOOK LOOK — the same palette, fonts, header and buttons as notepad.html / index.html ═══ */
    :root {
      --bg: #0B0F14; --surface: #131A21; --surface2: #1A232C; --bg-rgb: 11,15,20;
      --border: rgba(255,255,255,0.11); --text: #E9EEF2; --muted: #9AA7B2;
      --accent: #5CC4D0; --accent2: #7FD4DD; --accent-rgb: 92,196,208; --on-accent: #0B0F14;
      --primary-bg: #FFFFFF; --primary-text: #0B0F14;
      --purple: var(--accent); --purple2: var(--accent2); /* old names, kept so older rules pick up the new accent */
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      color-scheme: dark;
    }
    :root.light {
      --bg: #F3F5F7; --surface: #FFFFFF; --surface2: #EDF0F3; --bg-rgb: 243,245,247;
      --border: #DCE1E6; --text: #0B0F14; --muted: #55606B;
      --accent: #0F6E7A; --accent2: #0F6E7A; --accent-rgb: 15,110,122; --on-accent: #FFFFFF;
      --primary-bg: #0B0F14; --primary-text: #FFFFFF;
      color-scheme: light;
    }
    body, :root.light body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    h1, h2 { font-family: var(--serif); letter-spacing: -0.01em; }
    button, input, select, textarea { font-family: inherit; }
    input[type=text], input[type=email], input[type=password], input[type=search], textarea, select { border-radius: 10px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Header — same pieces as the homepage and the Notepad's top bar */
    nav, :root.light nav { position: static; display: block; height: auto; padding: 0; margin: 0; background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .hp-header { position: sticky; top: 0; z-index: 100; background: var(--surface); flex-shrink: 0; }
    .hp-header-row { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 20px; }
    .hp-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); flex-shrink: 0; margin-right: 14px; }
    .hp-brand img { width: 28px; height: 28px; object-fit: contain; border-radius: 0; }
    .hp-brand-name { font-family: var(--serif); font-size: 1.08rem; font-weight: 700; letter-spacing: -0.01em; }
    nav.hp-nav { display: flex; align-items: center; gap: 2px; }
    .hp-nav a { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 0.86rem; font-weight: 500; color: var(--muted); text-decoration: none; }
    .hp-nav a:hover { background: var(--surface2); color: var(--text); }
    .hp-nav a.active { color: var(--accent); font-weight: 600; background: rgba(var(--accent-rgb),0.1); }
    .hp-spacer { flex: 1; }
    .np-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--text); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background 0.15s; }
    .np-btn:hover { background: var(--surface2); }
    .np-btn-primary, .np-btn-primary:hover { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-text); }
    .np-btn-primary:hover { opacity: 0.88; }
    .np-back { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; color: var(--accent); text-decoration: none; flex-shrink: 0; white-space: nowrap; }
    .np-back:hover { background: rgba(var(--accent-rgb),0.1); }
    .hp-menu-btn { display: none; width: 36px; height: 36px; padding: 0; border: none; background: none; border-radius: 10px; color: var(--text); cursor: pointer; align-items: center; justify-content: center; }
    .hp-menu-btn:hover { background: var(--surface2); }
    .hp-header .nav-title { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-wave { display: block; width: 100%; height: 9px; color: var(--accent); opacity: 0.5; background: var(--surface); }

    /* Slide-out menu (narrow screens) */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); box-shadow: none; }
    .sidebar.open { box-shadow: 0 0 40px rgba(11,15,20,0.3); }
    .sidebar-overlay { background: rgba(11,15,20,0.45); backdrop-filter: none; }
    .sb-hd { border-bottom: none; }
    .sb-logo-row img { border-radius: 0; object-fit: contain; }
    .sb-logo-row span { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .sb-close { color: var(--muted); }
    .sb-close:hover { color: var(--text); background: var(--surface2); }
    .sb-item { color: var(--text); font-weight: 500; }
    .sb-item:hover { background: var(--surface2); color: var(--text); }
    .sb-item.active { background: rgba(var(--accent-rgb),0.12); color: var(--accent); font-weight: 600; }
    .sb-footer { border-top: 1px solid var(--border); }
    .sb-theme { color: var(--muted); }
    .sb-theme:hover { background: var(--surface2); color: var(--text); }

    /* Logo: white mark on dark theme, dark mark on light theme */
    .logo-lt { display: none !important; }
    :root.light .logo-lt { display: block !important; }
    :root.light .logo-dk { display: none !important; }

    @media (max-width: 720px) {
      .hp-collapsible nav.hp-nav { display: none; }
      .hp-collapsible .hp-menu-btn { display: inline-flex; }
      .hp-header-row { padding: 0 12px; gap: 6px; }
      .hp-brand { margin-right: 4px; }
    }
    @media (max-width: 460px) { .hp-brand-name { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/safe-html.js"></script>
</head>
<body>
<header class="hp-header">
  <div class="hp-header-row">
    <a class="hp-brand" href="index.html" aria-label="NoteCaptain home">
      <img class="logo-dk" src="images/logo-mark-white.png" alt=""><img class="logo-lt" src="images/logo-mark-dark.png" alt="">
      <span class="hp-brand-name">NoteCaptain.ai</span>
    </a>
    <div class="hp-spacer"></div>
    <span class="nav-badge" id="mode-badge">Shared Note</span>
    <button class="open-btn np-btn np-btn-primary" data-action="import">Open Notepad</button>
    <button style="display:none" class="np-btn" id="gn-theme-btn" data-action="theme" aria-label="Switch between light and dark mode">Dark</button>
  </div>
  <svg class="np-wave" aria-hidden="true" focusable="false">
    <defs><pattern id="nc-wave" width="56" height="9" patternUnits="userSpaceOnUse"><path d="M0 5.5 Q 14 0.5 28 5.5 T 56 5.5" fill="none" stroke="currentColor" stroke-width="1.3"/></pattern></defs>
    <rect width="100%" height="9" fill="url(#nc-wave)"/>
  </svg>
</header>
<script src="js/share-page-theme.js"></script>

<main id="main">
  <div class="state" id="loading-state">
    <div class="spinner"></div>
    <div style="font-size:0.85rem;color:#555;">Loading shared note…</div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/share-page.js"></script>
</body>
</html>
