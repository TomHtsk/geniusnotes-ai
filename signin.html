<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NoteCaptain AI</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #06060F; --surface: #12121E; --border: rgba(255,255,255,0.07);
      --text: #F0F0FF; --muted: #8888AA; --purple: #8B5CF6; --purple2: #A78BFA; --cyan: #4FC3F7;
    }
    :root.light {
      --bg: #FAF9F6; --surface: #fff; --border: rgba(0,0,0,0.08);
      --text: #0A0A1A; --muted: #666677;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 60px; border-bottom: 1px solid var(--border); background: rgba(var(--bg-rgb),0.92); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
    :root.light nav { background: rgba(244,244,252,0.92); }
    
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 1rem; color: var(--text); }
    .nav-logo .ai { color: var(--purple2); }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    .nav-link:hover { color: var(--text); }

    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; }
    .auth-card h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .auth-card .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }

    .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-bottom: 20px; }
    .google-btn:hover { background: rgba(255,255,255,0.05); }
    :root.light .google-btn:hover { background: rgba(0,0,0,0.04); }
    .google-icon { width: 18px; height: 18px; }

    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .divider span { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.15s; }
    :root.light .field input { background: var(--surface2); }
    .field input:focus { border-color: var(--purple); }
    .field input.error { border-color: #EF4444; }

    .field-row { position: relative; }
    .field-row input { padding-right: 44px; }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; align-items: center; outline: none; }
    .toggle-pw:hover { color: var(--text); }

    .forgot { display: block; text-align: right; font-size: 0.8rem; color: var(--purple2); text-decoration: none; margin-bottom: 20px; }
    .forgot:hover { text-decoration: underline; }

    .submit-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--primary-bg); color:var(--primary-text); font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #EF4444; font-size: 0.82rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .error-msg.show { display: block; }

    .switch { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
    .switch a { color: var(--purple2); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }
    /* Logo: white mark on dark theme, dark mark on light theme */
    .logo-lt{display:none!important;}
    :root.light .logo-lt{display:block!important;}
    :root.light .logo-dk{display:none!important;}
  </style>
<script>if(localStorage.getItem('gn-theme') !== 'dark')document.documentElement.classList.add("light");</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet"/>
  <script>if(localStorage.getItem('gn-theme')!=='dark')document.documentElement.classList.add('light');</script>
  <style id="logbook-look">
    /* ═══ LOGBOOK LOOK — the same palette, fonts, header and buttons as notepad.html / index.html ═══ */
    :root {
      --bg: #0B0F14; --surface: #131A21; --surface2: #1A232C; --bg-rgb: 11,15,20;
      --border: rgba(255,255,255,0.11); --text: #E9EEF2; --muted: #9AA7B2;
      --accent: #5CC4D0; --accent2: #7FD4DD; --accent-rgb: 92,196,208; --on-accent: #0B0F14;
      --primary-bg: #FFFFFF; --primary-text: #0B0F14;
      --purple: var(--accent); --purple2: var(--accent2); /* old names, kept so older rules pick up the new accent */
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      color-scheme: dark;
    }
    :root.light {
      --bg: #F3F5F7; --surface: #FFFFFF; --surface2: #EDF0F3; --bg-rgb: 243,245,247;
      --border: #DCE1E6; --text: #0B0F14; --muted: #55606B;
      --accent: #0F6E7A; --accent2: #0F6E7A; --accent-rgb: 15,110,122; --on-accent: #FFFFFF;
      --primary-bg: #0B0F14; --primary-text: #FFFFFF;
      color-scheme: light;
    }
    body, :root.light body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    h1, h2 { font-family: var(--serif); letter-spacing: -0.01em; }
    button, input, select, textarea { font-family: inherit; }
    input[type=text], input[type=email], input[type=password], input[type=search], textarea, select { border-radius: 10px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Header — same pieces as the homepage and the Notepad's top bar */
    nav, :root.light nav { position: static; display: block; height: auto; padding: 0; margin: 0; background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .hp-header { position: sticky; top: 0; z-index: 100; background: var(--surface); flex-shrink: 0; }
    .hp-header-row { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 20px; }
    .hp-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); flex-shrink: 0; margin-right: 14px; }
    .hp-brand img { width: 28px; height: 28px; object-fit: contain; border-radius: 0; }
    .hp-brand-name { font-family: var(--serif); font-size: 1.08rem; font-weight: 700; letter-spacing: -0.01em; }
    nav.hp-nav { display: flex; align-items: center; gap: 2px; }
    .hp-nav a { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 0.86rem; font-weight: 500; color: var(--muted); text-decoration: none; }
    .hp-nav a:hover { background: var(--surface2); color: var(--text); }
    .hp-nav a.active { color: var(--accent); font-weight: 600; background: rgba(var(--accent-rgb),0.1); }
    .hp-spacer { flex: 1; }
    .np-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--text); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background 0.15s; }
    .np-btn:hover { background: var(--surface2); }
    .np-btn-primary, .np-btn-primary:hover { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-text); }
    .np-btn-primary:hover { opacity: 0.88; }
    .np-back { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; color: var(--accent); text-decoration: none; flex-shrink: 0; white-space: nowrap; }
    .np-back:hover { background: rgba(var(--accent-rgb),0.1); }
    .hp-menu-btn { display: none; width: 36px; height: 36px; padding: 0; border: none; background: none; border-radius: 10px; color: var(--text); cursor: pointer; align-items: center; justify-content: center; }
    .hp-menu-btn:hover { background: var(--surface2); }
    .hp-header .nav-title { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-wave { display: block; width: 100%; height: 9px; color: var(--accent); opacity: 0.5; background: var(--surface); }

    /* Slide-out menu (narrow screens) */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); box-shadow: none; }
    .sidebar.open { box-shadow: 0 0 40px rgba(11,15,20,0.3); }
    .sidebar-overlay { background: rgba(11,15,20,0.45); backdrop-filter: none; }
    .sb-hd { border-bottom: none; }
    .sb-logo-row img { border-radius: 0; object-fit: contain; }
    .sb-logo-row span { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .sb-close { color: var(--muted); }
    .sb-close:hover { color: var(--text); background: var(--surface2); }
    .sb-item { color: var(--text); font-weight: 500; }
    .sb-item:hover { background: var(--surface2); color: var(--text); }
    .sb-item.active { background: rgba(var(--accent-rgb),0.12); color: var(--accent); font-weight: 600; }
    .sb-footer { border-top: 1px solid var(--border); }
    .sb-theme { color: var(--muted); }
    .sb-theme:hover { background: var(--surface2); color: var(--text); }

    /* Logo: white mark on dark theme, dark mark on light theme */
    .logo-lt { display: none !important; }
    :root.light .logo-lt { display: block !important; }
    :root.light .logo-dk { display: none !important; }

    @media (max-width: 720px) {
      .hp-collapsible nav.hp-nav { display: none; }
      .hp-collapsible .hp-menu-btn { display: inline-flex; }
      .hp-header-row { padding: 0 12px; gap: 6px; }
      .hp-brand { margin-right: 4px; }
    }
    @media (max-width: 460px) { .hp-brand-name { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
<header class="hp-header">
  <div class="hp-header-row">
    <a class="hp-brand" href="index.html" aria-label="NoteCaptain home">
      <img class="logo-dk" src="images/logo-mark-white.png" alt=""><img class="logo-lt" src="images/logo-mark-dark.png" alt="">
      <span class="hp-brand-name">NoteCaptain</span>
    </a>
    <nav class="hp-nav" aria-label="Main">
      <a href="index.html">Home</a>
    </nav>
    <div class="hp-spacer"></div>
    <a href="signup.html" class="np-btn">Create account</a>
    <button class="np-btn" id="gn-theme-btn" onclick="gnToggleTheme()" aria-label="Switch between light and dark mode">Dark</button>
  </div>
  <svg class="np-wave" aria-hidden="true" focusable="false">
    <defs><pattern id="nc-wave" width="56" height="9" patternUnits="userSpaceOnUse"><path d="M0 5.5 Q 14 0.5 28 5.5 T 56 5.5" fill="none" stroke="currentColor" stroke-width="1.3"/></pattern></defs>
    <rect width="100%" height="9" fill="url(#nc-wave)"/>
  </svg>
</header>
<script>
// Theme button: same behaviour as the homepage and the Notepad (light unless "dark" was chosen).
function gnSyncThemeBtn(){var b=document.getElementById('gn-theme-btn');if(b)b.textContent=document.documentElement.classList.contains('light')?'Dark':'Light';}
function gnToggleTheme(){var l=document.documentElement.classList.toggle('light');localStorage.setItem('gn-theme',l?'light':'dark');gnSyncThemeBtn();}
window.addEventListener('storage',function(e){if(e.key==='gn-theme'){document.documentElement.classList.toggle('light',e.newValue!=='dark');gnSyncThemeBtn();}});
gnSyncThemeBtn();
</script>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your NoteCaptain account</p>

    <button class="google-btn" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span>or sign in with email</span></div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="field">
      <label>Password</label>
      <div class="field-row">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="toggle-pw" id="togglePw" type="button"><svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <a href="reset.html" class="forgot">Forgot password?</a>

    <button class="submit-btn" id="submitBtn">Sign in</button>

    <div class="switch">Don't have an account? <a href="signup.html">Sign up free</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAwbZkiZR8NRgrFYCL041FHfGquHyeEJUI",
    authDomain: "geniusnotes-ai.firebaseapp.com",
    projectId: "geniusnotes-ai",
    storageBucket: "geniusnotes-ai.firebasestorage.app",
    messagingSenderId: "1041746856723",
    appId: "1:1041746856723:web:fae9072e0292c3946068e6",
    measurementId: "G-6MEN0RBSEF"
  });
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  // If already signed in, show a message instead of silently redirecting
  auth.onAuthStateChanged(user => {
    if (user) {
      document.querySelector('.auth-wrap').innerHTML = `
        <div class="auth-card" style="text-align:center">
          <div style="font-size:2.5rem;margin-bottom:16px">👋</div>
          <h1 style="margin-bottom:8px">You're signed in</h1>
          <p class="subtitle">Signed in as <strong>${user.email}</strong></p>
          <a href="notepad.html" style="display:block;width:100%;padding:13px;border-radius:10px;background:var(--primary-bg);color:var(--primary-text);font-weight:700;font-size:0.95rem;text-decoration:none;margin-bottom:12px;">Go to Notepad →</a>
          <button onclick="firebase.auth().signOut().then(()=>location.reload())" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.875rem;cursor:pointer;">Sign out &amp; use different account</button>
        </div>`;
    }
  });

  window.addEventListener('storage', e => { if (e.key === 'gn-theme') document.documentElement.classList.toggle('light', e.newValue !== 'dark'); });

  const emailEl   = document.getElementById('email');
  const passEl    = document.getElementById('password');
  const errorMsg  = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }
  function clearError() { errorMsg.classList.remove('show'); }

  const EYE_OPEN = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const EYE_CLOSED = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', () => {
    const show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    toggleBtn.innerHTML = show ? EYE_CLOSED : EYE_OPEN;
    toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Email/password sign in
  submitBtn.addEventListener('click', async () => {
    clearError();
    const email = emailEl.value.trim();
    const pass  = passEl.value;
    if (!email || !pass) return showError('Please fill in all fields.');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      window.location.href = 'index.html';
    } catch (e) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      const msgs = {
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-email': 'Please enter a valid email.',
        'auth/too-many-requests': 'Too many attempts. Try again later.',
        'auth/invalid-credential': 'Incorrect email or password.'
      };
      showError(msgs[e.code] || e.message);
    }
  });

  // Google sign in
  document.getElementById('googleBtn').addEventListener('click', async () => {
    clearError();
    try {
      await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      window.location.href = 'index.html';
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user') showError(e.message);
    }
  });

  // Enter key submits
  [emailEl, passEl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); }));
</script>
</body>
</html>
